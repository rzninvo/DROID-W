# Replica office0 — DROID-W (WildGS-SLAM) monocular tracking ONLY.
# Goal: obtain DROID-W ESTIMATED camera poses (not GT) for OVI-MAP integration.
# Inherits all tracking/mapping defaults from droid_w.yaml; mapping.enable stays False
# (tracking front/back-end only, metric-scale via da3_metric_large depth prior).
# Replica intrinsics (cam_params.json) and the canonical Splat-SLAM Replica output
# resolution (H_out=320, W_out=640) override the TUM cam block from droid_w.yaml.
inherit_from: ./configs/droid_w.yaml

dataset: replica
scene: room2_estpose

cam:
  H: 680
  W: 1200
  fx: 600.0
  fy: 600.0
  cx: 599.5
  cy: 339.5
  png_depth_scale: 6553.5
  H_edge: 0
  W_edge: 0
  H_out: 320
  W_out: 640

data:
  output: /mnt/T9/cvg/semfusion-work/droidw_out
  input_folder: /mnt/T9/cvg/semfusion-work/datasets/Replica/room2
